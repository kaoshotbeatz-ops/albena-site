name: D1 backup
# Nightly 04:00 ET export of the Albena portal D1 databases for the estate backup system (Change 110fbca7).
# The repo is public, so the export is encrypted with an age PUBLIC key; only ai5080 holds the private key.
# ai5080 pulls the latest artifact (estate-backups `d1` set) and stores it in restic (N+1: ai5080 + Cloudflare R2).
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d59bc8ce599de891f475d1cd8af22370
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install age
        run: sudo apt-get install -y --no-install-recommends age
      - name: Export and encrypt
        run: |
          set -euo pipefail
          for n in albena_portal albena_portal_staging; do
            npx --yes wrangler@4.149.0 d1 export "$n" --remote --output "$n.sql"
            grep -q "CREATE TABLE" "$n.sql"
          done
          tar -c ./*.sql | age -r age1zhr5cvrvp5a8j06due4r0tz8g3wj9zjqgc8suc9a80zak0mq9ccs54p65n -o d1-export.tar.age
          rm -f ./*.sql
      - uses: actions/upload-artifact@v4
        with:
          name: d1-export
          path: d1-export.tar.age
          retention-days: 3
          if-no-files-found: error
