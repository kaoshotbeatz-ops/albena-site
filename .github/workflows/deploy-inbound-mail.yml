name: Deploy inbound mail worker

# push to main -> verify -> production (manual approval via the "production" environment).
# Worker: inbound-mail/ (Cloudflare Email Routing -> R2 -> Obvera ticket). Secrets OBVERA_KEY and SIGNING_KEY live on the Worker (wrangler secret put), not in CI.

on:
  push:
    branches: [main]
    paths: ["inbound-mail/**", ".github/workflows/deploy-inbound-mail.yml"]
  pull_request:
    paths: ["inbound-mail/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-inbound-mail
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - working-directory: inbound-mail
        run: |
          npm ci
          npm run typecheck
          npm test

  deploy-prod:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - working-directory: inbound-mail
        run: npm ci
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: inbound-mail
          command: deploy
