name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # weekly scan (NIST CA-7)
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  SITE_URL: https://albena.ai

jobs:
  controls:
    name: Controls data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: controls.json is current
        run: node scripts/build-controls.mjs --check
      - name: Header check script self-test
        run: bash scripts/test-check-headers.sh

  build-web:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Install and build (web/ if present, else static root)
        run: |
          if [ -f web/package.json ]; then
            cd web
            npm ci
            # Preview/CI build only: uses Cloudflare's test Turnstile key. Never deployed.
            ALBENA_ALLOW_TEST_TURNSTILE=1 npm run build
            node scripts/seo-check.mjs
            cd ..
            rsync -a web/dist/ dist-out/
          else
            mkdir -p dist-out
            rsync -a --exclude '.git' --exclude '.github' --exclude 'controls' --exclude 'scripts' --exclude 'worker' --exclude 'BRIEF.md' --exclude 'site-dist' --exclude 'dist-out' --exclude 'web' --exclude 'lighthouserc.json' --exclude 'SECURITY.md' --exclude 'README.md' ./ dist-out/
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-dist
          path: dist-out
          if-no-files-found: error

  worker-tests:
    name: Worker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: hashFiles('worker/package.json') != ''
        with:
          node-version: 24
      - name: Install and test
        if: hashFiles('worker/package.json') != ''
        working-directory: worker
        run: |
          npm ci
          npm test --if-present
      - name: Skipped (no worker/)
        if: hashFiles('worker/package.json') == ''
        run: echo "No worker/ directory; skipping."

  portal-worker:
    name: Portal worker (typecheck + tests + dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Build portal web (the worker serves its dist)
        working-directory: portal/web
        run: |
          npm ci
          # CI build only: Cloudflare test Turnstile key. Never deployed.
          ALBENA_ALLOW_TEST_TURNSTILE=1 npm run build
          # Build guard: required pages (/, /login, /invite) exist and a Turnstile site key is baked in.
          npm run check:build
      - name: Install, typecheck, test
        working-directory: portal/worker
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: wrangler deploy --dry-run (no deploy, no cloud access)
        working-directory: portal/worker
        run: npx wrangler deploy --dry-run

  portal-web:
    name: Portal web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Install and build
        working-directory: portal/web
        run: |
          npm ci
          # CI build only: Cloudflare test Turnstile key. Never deployed.
          ALBENA_ALLOW_TEST_TURNSTILE=1 npm run build
          # Build guard: required pages (/, /login, /invite) exist and a Turnstile site key is baked in.
          npm run check:build

  portal-hub-client:
    name: Portal hub client tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python tests
        working-directory: portal/hub-client
        run: python3 -m unittest discover -s tests

  portal-audit:
    name: Portal npm audit (high)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Audit portal packages
        run: |
          status=0
          for dir in portal/web portal/worker; do
            echo "== npm audit in $dir"
            (cd "$dir" && npm audit --audit-level=high) || status=1
          done
          exit $status

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 \
            detect --source /repo --redact --verbose --exit-code 1

  audit:
    name: npm audit (high)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Audit each package with a lockfile
        run: |
          status=0
          found=0
          for dir in . web worker; do
            if [ -f "$dir/package-lock.json" ]; then
              found=1
              echo "== npm audit in $dir"
              (cd "$dir" && npm audit --audit-level=high) || status=1
            fi
          done
          [ "$found" = 1 ] || echo "No lockfiles found; nothing to audit."
          exit $status

  sast:
    name: Semgrep (p/default)
    runs-on: ubuntu-latest
    container:
      # digest of :latest resolved 2026-10-09; refresh manually (Dependabot does not track workflow container images)
      image: semgrep/semgrep@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Semgrep scan
        run: semgrep scan --config p/default --error --metrics=off --exclude controls --exclude node_modules

  a11y:
    name: Accessibility (Lighthouse >= 95)
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-dist
          path: artifact
      - name: Lighthouse CI on locally served site
        run: |
          npx --yes @lhci/cli@0.14.0 autorun --collect.staticDistDir=artifact --config=./lighthouserc.json

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    permissions:
      contents: write # only used to attach SBOMs to a published release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Generate SBOMs (SR-4 / CM-8)
        run: |
          mkdir -p sbom
          for dir in web worker; do
            (cd "$dir" && npm ci --ignore-scripts && npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --ignore-npm-errors --output-format JSON --output-file "../sbom/sbom-$dir.cdx.json")
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom
          if-no-files-found: error
      - name: Attach SBOMs to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" sbom/*.cdx.json --clobber --repo "${{ github.repository }}"

  deploy:
    name: Deploy (production)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [controls, build-web, worker-tests, secrets, audit, sast, a11y]
    runs-on: ubuntu-latest
    environment: production # configure required reviewers in repo settings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Rebuild web with production Turnstile site key
        run: |
          if [ -f web/package.json ]; then
            cd web
            npm ci
            npm run build
          fi
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          ALBENA_ALLOW_TEST_TURNSTILE: ""
      - name: Install worker dependencies
        if: hashFiles('worker/package.json') != ''
        working-directory: worker
        run: npm ci
      - name: Require CLOUDFLARE_API_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Missing secret::Repository secret CLOUDFLARE_API_TOKEN is not set. Create an 'Edit Cloudflare Workers' API token (scoped to this account and zone albena.ai, plus D1 Edit if migrations run in CI) and add it under GitHub repo > Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: wrangler deploy
        if: hashFiles('worker/package.json') != ''
        working-directory: worker
        # --env "" targets the top-level (production) config, not the staging env
        run: npx wrangler deploy --env ""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: No worker yet
        if: hashFiles('worker/package.json') == ''
        run: echo "worker/ not present; nothing to deploy with wrangler."
      - name: Post-deploy header check
        run: bash scripts/check-headers.sh "$SITE_URL"
      - name: Notify IndexNow (Bing, Yandex) of the new sitemap
        # Best effort: a failed ping must never fail a deploy. The key is public by design.
        continue-on-error: true
        run: node scripts/indexnow.mjs

  zap:
    name: OWASP ZAP baseline (non-blocking)
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ env.SITE_URL }}
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-baseline-report
