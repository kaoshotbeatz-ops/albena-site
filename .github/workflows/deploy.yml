name: Deploy portal

# push to main -> verify -> staging (auto) -> production (manual approval via the "production" environment).
# Scope: the portal worker (account.albena.ai). The marketing worker still deploys from ci.yml.
# Setup (secrets, vars, environments, staging D1): docs/PIPELINE.md

on:
  push:
    branches: [main]
    paths: ["portal/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-portal
  cancel-in-progress: false # never cancel a deploy half way

jobs:
  verify:
    name: Verify (typecheck, tests, build guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Web build + guard (test key allowed, this build is never deployed)
        working-directory: portal/web
        run: |
          npm ci
          ALBENA_ALLOW_TEST_TURNSTILE=1 npm run build
          npm run check:build
      - name: Worker typecheck + tests
        working-directory: portal/worker
        run: |
          npm ci
          npm run typecheck
          npm test

  deploy-staging:
    name: Deploy staging
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.PORTAL_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Require configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          PORTAL_URL: ${{ vars.PORTAL_URL }}
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TURNSTILE_SITE_KEY PORTAL_URL; do
            [ -n "${!v}" ] || { echo "::error title=Missing config::$v is not set for the staging environment (see docs/PIPELINE.md)"; exit 1; }
          done
          if grep -q TODO portal/worker/wrangler.jsonc; then
            echo "::error title=Staging not configured::portal/worker/wrangler.jsonc still has TODO placeholders in env.staging (see docs/PIPELINE.md)"; exit 1
          fi
      - name: Build web with the staging Turnstile site key
        working-directory: portal/web
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: |
          npm ci
          npm run build
          npm run check:build:deploy
      - name: Install worker dependencies
        working-directory: portal/worker
        run: npm ci
      - name: Apply D1 migrations (staging)
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: portal/worker
          command: d1 migrations apply albena_portal_staging --env staging --remote
      - name: Deploy worker (staging)
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: portal/worker
          command: deploy --env staging
      - name: Smoke test staging
        run: bash portal/scripts/smoke-portal.sh "${{ vars.PORTAL_URL }}"

  deploy-prod:
    name: Deploy production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production # required reviewers on this environment = the manual approval gate
      url: ${{ vars.PORTAL_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Require configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          PORTAL_URL: ${{ vars.PORTAL_URL }}
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TURNSTILE_SITE_KEY PORTAL_URL; do
            [ -n "${!v}" ] || { echo "::error title=Missing config::$v is not set for the production environment (see docs/PIPELINE.md)"; exit 1; }
          done
      - name: Build web with the production Turnstile site key
        working-directory: portal/web
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: |
          npm ci
          npm run build
          npm run check:build:deploy
      - name: Install worker dependencies
        working-directory: portal/worker
        run: npm ci
      - name: Apply D1 migrations (production)
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: portal/worker
          command: d1 migrations apply albena_portal --remote
      - name: Deploy worker (production)
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: portal/worker
          command: deploy
      - name: Smoke test production
        id: smoke
        run: bash portal/scripts/smoke-portal.sh "${{ vars.PORTAL_URL }}"
      - name: Roll back worker (smoke failed)
        if: failure() && steps.smoke.outcome == 'failure'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: portal/worker
          command: 'rollback --message "auto-rollback ${{ github.sha }} smoke test failed" --yes'
